[project]
name = "geoai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.2",
    "logfire>=4.31.0",
    "loguru>=0.7.3",
    "pydantic-ai>=1.73.0",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
